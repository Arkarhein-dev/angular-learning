<form (ngSubmit)="onSubmit()" #form>
  <app-control label="Title">
    <input type="text" name="title" [(ngModel)]="enteredTitle" />
  </app-control>

  <app-control label="Request">
    <textarea name="request" id="" rows="3" [(ngModel)]="enteredRequest"></textarea>
  </app-control>
  <button appButton>
    Submit
    <span ngProjectAs="icon">&#10148;</span>
  </button>
</form>
