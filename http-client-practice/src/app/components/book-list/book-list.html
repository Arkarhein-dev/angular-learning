<a routerLink="/add-book" class="add-book-btn">+ Add new Book</a>

<div class="table-container">
  <table class="library-table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (book of bookService.books(); track book.id) {
        <tr>
          <td>{{ book.id }}</td>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.isbn }}</td>
          <td>{{ book.category }}</td>
          <td>
            <button class="edit-btn" (click)="onEdit(book.id)">Edit</button>
            <button class="delete-btn" (click)="onDelete(book.id)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="empty-state">No books found in this library management system.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
