<div class="task-component">
  <div class="task-title">
    <h2>{{ selectedUser?.name }}'s Tasks</h2>
    <button (click)="onAddNewTask()">Add Task</button>
  </div>
  <ul>
    @for (task of tasks; track task.id) {
      <li class="task-list">
        <app-task [task]="task" (complete)="completedTask($event)" />
      </li>
    } @empty {
      <h2>No Task Found</h2>
    }
  </ul>
</div>

@if (isAddingTask) {
  <app-new-task [userId]="selectedUser.id" (close)="onCancelAddTask()" />
}
