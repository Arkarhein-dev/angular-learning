<div class="back-drop" (click)="onCancel()"></div>
<dialog open>
  <h2>Add Task</h2>
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="title">Title</label>
      <input type="text" name="title" [(ngModel)]="enteredTitle" />
    </p>

    <p>
      <label for="">Summary</label>
      <textarea name="summary" id="" [(ngModel)]="enteredSummary"></textarea>
    </p>
    <p>
      <label for="">Date</label>
      <input type="date" id="due-date" name="date" [(ngModel)]="enteredDate" />
    </p>
    <p class="actions">
      <button submit="button" (click)="onCancel()" class="cancel-btn">Cancel</button>
      <button submit="submit">Create</button>
    </p>
  </form>
</dialog>
